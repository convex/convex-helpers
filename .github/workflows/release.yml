name: Release

# Version-bump commits on main are release candidates, whether pushed directly
# or merged in a PR. npm must grant this workflow STAGE-ONLY trusted publishing.
# A successful upload gets a Git tag; a maintainer still approves on npm with 2FA.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full SHA of a version-bump commit already on main (retry staging)"
        required: true
        type: string

# Different pushes must not cancel each other. Duplicate runs for one push serialize.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    if: github.repository == 'convex/convex-helpers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Find version-bump commits
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: node scripts/release-plan.mjs

  release:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    name: Release ${{ matrix.release.version }}
    # Each candidate has its own stage -> tag dependency, so another candidate's
    # failure cannot block tagging a successfully staged version.
    # Workflow calls resolve at the caller commit, not from a checked-out workspace.
    # Keep the syntax supported by actionlint until it supports $/ workflow calls.
    uses: ./.github/workflows/release-candidate.yml # zizmor: ignore[self-repository]
    permissions:
      contents: write
      id-token: write
    with:
      sha: ${{ matrix.release.sha }}
      version: ${{ matrix.release.version }}
      distTag: ${{ matrix.release.distTag }}
