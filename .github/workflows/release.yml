name: Release

on:
  push:
    tags: ["v*"]
  # Started on a tag by the version workflow, or by hand to retry a tag.
  workflow_dispatch:

# One group per tag: versions never cancel each other, and reruns of a tag wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      artifact_id: ${{ steps.pack.outputs.artifact-id }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      node: ${{ steps.node.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - id: release
        uses: convex/npm-release-actions/validate-tag@3a142e21f421319890981579b8952267bc11fc53 # v0.3.0
      - run: npm ci
      - name: Check for pending changesets
        run: |
          node --input-type=module <<'JS'
          import { readdirSync } from 'node:fs';
          const pending = readdirSync('.changeset').filter(file => file.endsWith('.md') && !/^(README|AGENTS|CLAUDE|GEMINI)\.md$/i.test(file) && !file.startsWith('.'));
          if (pending.length) throw new Error(`Run npx changeset version to consume pending changesets: ${pending.join(', ')}`);
          JS
      - name: Build and check
        run: |
          npm run build
          npm run check
      - id: pack
        uses: convex/npm-release-actions/pack@3a142e21f421319890981579b8952267bc11fc53 # v0.3.0

  stage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: convex/npm-release-actions/stage@3a142e21f421319890981579b8952267bc11fc53 # v0.3.0
        with:
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          sha256: ${{ needs.build.outputs.sha256 }}
          name: ${{ needs.build.outputs.name }}
          version: ${{ needs.build.outputs.version }}
          channel: ${{ needs.build.outputs.channel }}
          node-version: ${{ needs.build.outputs.node }}
