name: Release

# Version-bump commits on main are release candidates, whether pushed directly
# or merged in a PR. Other branches require an explicit manual dispatch.
# npm must grant this workflow STAGE-ONLY trusted publishing.
# A successful upload gets a Git tag; a maintainer still approves on npm with 2FA.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full SHA of a version-bump commit on the selected ref (defaults to its tip)"
        required: false
        type: string

# Different pushes must not cancel each other. Duplicate runs for one push serialize.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    # Forks should skip publishing rather than fail because npm trust is absent.
    if: github.repository == 'convex/convex-helpers'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          # Intentionally avoid restoring caches in the release workflow.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Find the release commit
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import semver from 'semver';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const manifest = sha => JSON.parse(git('show', `${sha}:package.json`));
          const { BEFORE, GITHUB_SHA, GITHUB_EVENT_NAME, RELEASE_COMMIT, GITHUB_OUTPUT } = process.env;
          const requested = GITHUB_EVENT_NAME === 'workflow_dispatch' ? RELEASE_COMMIT || GITHUB_SHA : undefined;
          const start = requested || BEFORE;
          if (![start, GITHUB_SHA].every(sha => /^[a-f0-9]{40}$/.test(sha))) throw new Error('Expected full Git commit SHAs');
          if (requested) git('merge-base', '--is-ancestor', requested, GITHUB_SHA);
          // Use the last version change, even when ordinary commits follow it.
          const candidates = requested ? [requested] : git('rev-list', '--first-parent', '--reverse', `${BEFORE}..${GITHUB_SHA}`).split('\n').filter(Boolean);
          const releases = candidates.filter(sha => manifest(sha).version !== manifest(`${sha}^1`).version);
          if (requested && !releases.length) throw new Error('This commit does not bump the version');
          let release = null;
          if (releases.length) {
            const sha = releases.at(-1);
            const pkg = manifest(sha);
            const parsed = semver.parse(pkg.version);
            const canonical = parsed && parsed.version + (parsed.build.length ? `+${parsed.build.join('.')}` : '');
            if (!parsed || pkg.version !== canonical) throw new Error('Invalid release version');
            // Numeric/range-like prerelease identifiers cannot be npm dist-tags.
            const pre = parsed.prerelease[0];
            const distTag = pre === undefined ? 'latest' : semver.validRange(String(pre)) ? 'next' : String(pre);
            const tag = `v${pkg.version}`;
            const tagged = git('tag', '--list', tag);
            if (!requested && tagged) {
              // A branch release may land later with a different merge/squash SHA.
              console.log(`${tag} was already staged; skipping automatic release`);
            } else {
              if (tagged && git('rev-parse', `refs/tags/${tag}^{commit}`) !== sha) throw new Error('Existing tag identifies a different commit');
              release = { sha, name: pkg.name, version: pkg.version, distTag };
            }
          }
          appendFileSync(GITHUB_OUTPUT, `release=${JSON.stringify(release)}\n`);
          JS

  build:
    needs: plan
    if: needs.plan.outputs.release != 'null'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.release).sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - run: npm ci
      - name: Check for pending changesets
        run: |
          node --input-type=module <<'JS'
          import { readdirSync } from 'node:fs';
          const pending = readdirSync('.changeset').filter(file => file.endsWith('.md') && !/^(README|AGENTS|CLAUDE|GEMINI)\.md$/i.test(file) && !file.startsWith('.'));
          if (pending.length) throw new Error(`Run npx changeset version to consume pending changesets: ${pending.join(', ')}`);
          JS
      - name: Build and check
        run: |
          npm run build
          npm run check
      - name: Pack the tested build without rebuilding
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error

  stage:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # Only upload the tarball: no dependencies or package scripts run with OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.release).sha }}
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release
          merge-multiple: true
      - name: Stage on npm
        working-directory: ${{ runner.temp }}/npm-release
        env:
          DIST_TAG: ${{ fromJSON(needs.plan.outputs.release).distTag }}
          PACKAGE_NAME: ${{ fromJSON(needs.plan.outputs.release).name }}
          VERSION: ${{ fromJSON(needs.plan.outputs.release).version }}
          RELEASE_SHA: ${{ fromJSON(needs.plan.outputs.release).sha }}
        run: |
          {
            echo "## $PACKAGE_NAME@$VERSION"
            echo "Source: $RELEASE_SHA; npm dist-tag: $DIST_TAG."
            echo 'After this step succeeds, open Settings → Staged Packages on https://www.npmjs.com and approve with 2FA.'
            echo 'The log below contains the stage ID to run: npm stage approve <stage-id>.'
            echo 'The Git tag records successful staging, not approval or publication.'
          } >> "$GITHUB_STEP_SUMMARY"
          # npm provenance otherwise records the event SHA, which may be newer
          # than the release commit (or different when retrying an older release).
          GITHUB_SHA="$RELEASE_SHA" npm stage publish ./*.tgz --ignore-scripts --provenance --tag "$DIST_TAG"

  tag:
    needs: [plan, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # No checkout, package scripts, or npm credentials in the job that can write tags.
    # Re-run failed jobs if tagging fails: successful staging jobs are not repeated.
    steps:
      - name: Create the tag without moving an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ fromJSON(needs.plan.outputs.release).version }}
          RELEASE_SHA: ${{ fromJSON(needs.plan.outputs.release).sha }}
        run: |
          node --input-type=module <<'JS'
          const { GH_TOKEN, GITHUB_API_URL, GITHUB_REPOSITORY, VERSION, RELEASE_SHA } = process.env;
          const root = `${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git`;
          const headers = { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          const url = `${root}/ref/tags/v${VERSION}`;
          const check = async () => {
            const response = await fetch(url, { headers });
            if (response.status === 404) return false;
            if (!response.ok) throw new Error(`Reading tag failed: ${response.status}`);
            let { object } = await response.json();
            // Accept existing annotated tags only when they resolve to the same commit.
            for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
              const tag = await fetch(`${root}/tags/${object.sha}`, { headers });
              if (!tag.ok) throw new Error(`Reading annotated tag failed: ${tag.status}`);
              ({ object } = await tag.json());
            }
            if (object.type !== 'commit' || object.sha !== RELEASE_SHA) throw new Error('Existing tag points elsewhere; refusing to move it');
            return true;
          };
          if (!await check()) {
            const response = await fetch(`${root}/refs`, {
              method: 'POST', headers,
              body: JSON.stringify({ ref: `refs/tags/v${VERSION}`, sha: RELEASE_SHA }),
            });
            if (!response.ok && !await check()) throw new Error(`Creating tag failed: ${response.status}`);
          }
          console.log(`v${VERSION} identifies staged commit ${RELEASE_SHA}. npm approval is still required.`);
          JS
